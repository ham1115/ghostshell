# =====================================================================
#  GHOSTSHELL :: Relay Nine
#
#  docker compose build          build the relay image
#  docker compose up -d          start it
#  docker compose logs -f        watch it
#  docker compose down           stop and remove it
#
#  Default binding is 127.0.0.1:2222 — reachable from the host laptop
#  only. To let other machines on the event LAN play against this
#  laptop, see "Hosting for a room" in RUNNING.md.
#  Changed it to a loopback 0.0.0.0:2222
# =====================================================================

services:
  ghostshell:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghostshell:1.0
    container_name: ghostshell
    hostname: relay9
    restart: unless-stopped

    ports:
      - "127.0.0.1:2222:2222"

    # --- hardening ---------------------------------------------------
    # no-new-privileges blocks setuid/file-capability escalation on
    # exec. The provisioning script already strips every setuid bit in
    # the image, so this is the second of two independent barriers.
    security_opt:
      - no-new-privileges:true

    # sshd legitimately needs to change uid, chroot its privilege
    # separation process and write audit records, so those stay. The
    # capabilities that matter for container escape and for sniffing
    # other players' traffic are dropped.
    cap_drop:
      - SYS_ADMIN
      - SYS_MODULE
      - SYS_PTRACE
      - SYS_RAWIO
      - SYS_BOOT
      - SYS_TIME
      - NET_ADMIN
      - NET_RAW
      - MKNOD
      - DAC_READ_SEARCH
      - LINUX_IMMUTABLE

    # One player cannot fork-bomb the room out of the game.
    pids_limit: 512

    # The relay never needs to reach the internet, so it is put on an
    # internal-only bridge. Published ports still work.
    networks:
      - relay

    # Only /tmp and /run are writable, and /tmp cannot hold setuid
    # binaries or device nodes.
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777,size=64m
      - /run:rw,nosuid,nodev,mode=0755,size=16m

    ulimits:
      nproc: 512
      nofile:
        soft: 1024
        hard: 2048

    mem_limit: 1g
    cpus: 2.0

    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2222 && nc -z 127.0.0.1 31337"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  relay:
    driver: bridge
    internal: false
